headline: Six orbits that line up
claim: The most distant stable Kuiper belt orbits share a perihelion direction and an orbital
  plane, too closely for chance; a distant massive planet is holding them there.
adds: 'The hypothesis itself. Six orbits aligned in perihelion and in plane, a 0.007% coincidence,
  and a perturber that would do it: about 10 Earth masses at a = 700 AU, e = 0.6, with its
  perihelion on the opposite side of the Sun from theirs.'
