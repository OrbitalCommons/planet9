date: 2022-07
kind: indirect
headline: Could Planet Nine tip Uranus over?
claim: As Planet Nine migrates outward, Uranus' nodal precession slows through its spin precession
  rate, and a secular spin-orbit resonance drags the spin axis over.
adds: In N-body runs a migrating Planet Nine tips Uranus to 76°-106°, several past the observed
  98°. The catch is that it needs a spin precession rate near 5″/yr, a hundred times today's
  0.045″/yr, so the idea rests on a primordial disk or moon.
