headline: Pan-STARRS again, every exposure
claim: Linking detections from 708,554 Pan-STARRS1 exposures, calibrated with injected synthetic
  objects, should find any planet bright enough out to 1600 AU.
adds: It finds 692 solar-system objects, 109 of them new, but no planet. Alone the search rules
  out 76% of the predicted orbits, against 69% for the 2024 Pan-STARRS1 search, and what remains
  is concentrated in the galactic plane.
