headline: Low inclinations that need a planet
claim: Models of Kuiper belt formation with eight planets and with nine should fill the distant
  detached region with different orbital inclinations.
adds: With eight planets, distant detached orbits are made by Kozai cycles inside Neptune's
  resonances, which leave none below i ≈ 20°. A ninth planet adds a low-inclination detached
  group, so further detections there can test it.
