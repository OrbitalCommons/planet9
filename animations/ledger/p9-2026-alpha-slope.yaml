crate: p9-2026-alpha-slope
cite: Eldadi & Loeb (2026)
title: A Framework for Applying the Loeb-Turner $\alpha$-Slope Test to Archival Photometry of
  Trans-Neptunian Objects
arxiv: '2605.17098'
date: 2026-05
kind: forecast
headline: Reflected or self-luminous?
claim: Reflected sunlight fades as distance to the power -4 and self-luminous emission as -2,
  so archival photometry of trans-Neptunian objects should tell the two apart.
adds: It cannot yet. None of Pluto's 22 bins recovers -4. Of 8,606 bins 186 pass every cut,
  53 reflected, 109 neither, and 24 self-luminous that all come from Pan-STARRS, a calibration
  artefact. Rubin's uniform photometry can settle it.
track: none
