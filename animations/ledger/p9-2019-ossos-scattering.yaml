cite: Kaib et al. (2019)
title: 'OSSOS XV: Probing the Distant Solar System with Observed Scattering TNOs'
arxiv: '1905.09286'
date: 2019-05
kind: dynamics
headline: What the scattering objects allow
claim: The 69 scattering objects and centaurs from OSSOS, with biases known, test whether
  a distant planet or the Oort cloud supplies the steeply tilted ones.
adds: A 5 Earth-mass planet yields the observed share of scatterers tilted past 45 degrees
  but excites inclinations overall more than observed; the Oort cloud gives about 3 times
  too few. The asymmetry it imprints on detached orbits is weaker than presumed.
