crate: p9-2016-inclination-instability
cite: Madigan & McCourt (2015)
title: 'A new inclination instability reshapes Keplerian disks into cones: application to the
  outer Solar System'
arxiv: '1509.08920'
date: 2015-09
kind: alternative
headline: A disk that tips itself over
claim: A flattened disk of eccentric orbits is self-gravitationally unstable and tilts itself,
  with no planet needed.
adds: Disk self-gravity alone can raise inclinations -- a caution against over-attributing to
  P9. Whether it operated depends on the early disk's mass, which is uncertain.
