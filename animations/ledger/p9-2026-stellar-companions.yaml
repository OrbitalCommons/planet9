title: A Solar-System Window for Hidden Stellar Companions
arxiv: '2606.25190'
date: 2026-06
kind: forecast
headline: A window for hidden companions
claim: The Sun's nearest companion might be a hidden, gravity-only object at hundreds-to-thousands
  of AU rather than a star at a parsec.
adds: A smooth dark-matter halo cannot supply it -- only a sub-Pluto mass lies within 1000 AU.
  Any such companion must be a structured, bound object, visible only through its gravity.
