crate: p9-2022-iras-candidate
cite: Rowan-Robinson (2021)
title: A search for Planet 9 in the IRAS data
arxiv: '2111.03831'
date: 2021-11
kind: search
headline: One candidate in the 1983 IRAS scans
claim: Planet Nine could have been recorded by IRAS in 1983 as a faint 60 µm source that
  shifts by arcminutes between passes months apart.
adds: Of 683 paired detections one survives, a 0.57 Jy source that moved 20 arcmin in 12
  weeks, fitting a 3-5 Earth-mass body at 225 ± 15 AU. It sits 72° from the ecliptic in galactic
  cirrus, far from every predicted orbit, and is unconfirmed.
track: none
