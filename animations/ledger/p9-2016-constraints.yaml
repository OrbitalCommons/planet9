crate: p9-2016-constraints
cite: Brown & Batygin (2016)
title: Observational constraints on the orbit and location of Planet Nine in the outer solar
  system
arxiv: '1603.05712'
date: 2016-03
kind: evidence
headline: Turning a hunch into a number
claim: If Planet Nine is real, its sculpting leaves quantitative, testable signatures in the
  distant disk.
adds: Two metrics -- apsidal confinement and a detached-object surplus -- turn the hypothesis
  into numbers. Acceptable P9 parameters are those that reproduce both metrics simultaneously.
track: none
