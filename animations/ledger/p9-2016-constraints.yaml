crate: p9-2016-constraints
cite: Brown & Batygin (2016)
title: Observational constraints on the orbit and location of Planet Nine in the outer solar
  system
arxiv: '1603.05712'
date: 2016-03
kind: evidence
headline: Narrowing down where to look
claim: Simulations over a grid of masses and orbits show which planets reproduce the alignment,
  and where on its orbit such a planet could still be hiding.
adds: Only a narrow family works, a = 380-980 AU, perihelion 150-350 AU, 5-20 Earth masses,
  tilted about 30 degrees. Existing surveys already cover the bright two-thirds of the orbit;
  the planet is probably near aphelion at V = 22-25.
