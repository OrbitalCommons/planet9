crate: p9-2016-secular-resonance
cite: Beust (2016)
title: Orbital clustering of distant Kuiper Belt Objects by hypothetical Planet 9. Secular or
  resonant ?
arxiv: '1605.02473'
date: 2016-05
kind: dynamics
headline: Secular or resonant?
claim: The secular model behind the clustering was built on a truncated series that does
  not converge; recomputed with no expansion, it may confine orbits without any resonance.
adds: Computed without the truncated series, the secular Hamiltonian has a high-eccentricity
  family of orbits whose apse never lines up with the planet's. Secular dynamics alone can
  hold orbits anti-aligned; resonance is one route to clustering, not the only one.
track: none
