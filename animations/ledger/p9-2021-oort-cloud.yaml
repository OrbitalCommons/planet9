title: Injection of Inner Oort Cloud Objects Into the Distant Kuiper Belt by Planet Nine
arxiv: '2104.05799'
date: 2021-04
kind: dynamics
headline: Planet Nine reaches into the Oort cloud
claim: Planet Nine should also drag inner Oort cloud objects down into the distant Kuiper
  belt, mixing a second population into the observed sample.
adds: The distant census is a mixture of Kuiper belt objects and injected inner Oort cloud
  objects. The injected ones are confined more weakly (67% against 88%), so matching the observed
  clustering takes a more eccentric Planet Nine.
