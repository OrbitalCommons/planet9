crate: p9-2024-neptune-crossing
cite: Batygin et al. (2024)
title: Generation of Low-Inclination, Neptune-Crossing TNOs by Planet Nine
arxiv: '2404.11594'
date: 2024-04
kind: evidence
headline: Neptune crossers as a new test
claim: Long-period, low-inclination objects that cross Neptune's orbit are short-lived, so
  their perihelia test whether Planet Nine keeps supplying them.
adds: A line of evidence independent of the clustering. The perihelia of 17 Neptune-crossing
  objects with a > 100 AU match simulations that include Planet Nine (p = 0.41), and the same
  simulations without it are rejected at about 5σ.
track: none
