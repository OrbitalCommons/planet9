crate: p9-2021-perihelion-gap
cite: Oldroyd & Trujillo (2021)
title: Outer Solar System Perihelion Gap Formation Through Interactions with a Hypothetical
  Distant Giant Planet
arxiv: '2107.06296'
date: 2021-07
kind: dynamics
headline: The empty lane at 50 to 65 AU
claim: Almost no distant, eccentric orbits have perihelia between 50 and 65 AU. Is that gap
  real, and can a distant planet carve it?
adds: One continuous population is very unlikely to leave the gap. With a distant planet, captured
  objects sweep across it in perihelion cycles and linger beyond 65 AU, so the gap should hold
  about 20% as many objects as the region just outside it.
track: none
