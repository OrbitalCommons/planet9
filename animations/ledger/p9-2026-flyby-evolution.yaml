kind: alternative
headline: The flyby, 4.5 billion years on
claim: A 0.8 M☉ star passing at 110 AU, inclined 70°, reproduces the TNO families. Does the match
  survive 4.5 Gyr of the giant planets?
adds: It improves. Neptune clears 63% of the 30-40 AU tracers (13% in the first 10 Myr) and 80% of
  the cold belt, while detached, Sedna-like and retrograde orbits stay put. No present-day planet
  is needed.
