title: 'A TESS Search for Distant Solar System Objects: Yield Estimates'
arxiv: '1911.03676'
date: 2019-11
kind: forecast
headline: An exoplanet telescope turned outward
claim: Shifting and stacking the 1,300 images of a TESS sector reaches I = 22, deep enough
  to reveal Planet Nine and hundreds of new Kuiper belt objects.
adds: A depth of I = 22 over most of the sky puts a 5-10 Earth-mass planet within reach to
  about 700 AU, and its drift across a sector stays measurable to 900 AU. The same stacks could
  turn up hundreds of new Kuiper belt objects and Centaurs.
