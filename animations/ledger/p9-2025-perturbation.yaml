kind: dynamics
headline: Chaos closer to Neptune
claim: Carrying the resonance-overlap theory of the scattered disk past the quadrupole should
  explain the chaos of orbits nearer to Neptune.
adds: The octupole's 1:j and 3:j resonances set no new stability limit on their own. Nearer
  to Neptune, chains of ever higher index (2:j, 3:j, 4:j and on) intersect, and those intersections
  explain the local chaos that shapes the scattered disk.
