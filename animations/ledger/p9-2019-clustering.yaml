kind: evidence
headline: Fourteen orbits, both alignments at once
claim: With the survey bias modelled in perihelion direction and in orbital pole together,
  the fourteen known distant orbits are still too aligned to be chance.
adds: The sample grows from 10 to 14 and the test covers perihelion direction and orbital
  plane jointly. The chance of clustering this strong in both is 0.2%. OSSOS alone, with four
  such objects, could not have detected it.
