headline: The solar tilt in one formula
claim: The Sun's tilt under Planet Nine follows in closed form from two precession frequencies,
  with the precession of the Sun's own spin axis included.
adds: A closed form, θ = (2Ωy/Ωz) sin(Ωz t/2), replaces the numerical integrations. A 6° tilt
  with the right node needs an effective semi-major axis a√(1-e²) of 340-480 AU, and the tilt
  is largest where the two precessions match.
