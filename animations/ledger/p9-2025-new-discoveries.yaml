kind: discovery
headline: A new world pointing the wrong way
claim: A dwarf-planet candidate found in archival images, 2017 OF201, travels far enough out
  that Planet Nine should have herded its orbit into line with the others.
adds: '2017 OF201: about 700 km across, a = 830 AU, perihelion 45 AU, pointing 106° off the
  cluster. Added to the vetted sample it drops the alignment strength from 0.65 to 0.57;
  Ammonite, found three months later and also off-cluster, takes it to 0.47.'
