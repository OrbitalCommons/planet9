cite: Russell & White (2025)
title: The Radius, Composition, Albedo, and Absolute Magnitude of Planet Nine Based on Exoplanets
  with Teq less than 600 K and the Planet Nine Reference Population 3.0
arxiv: '2507.22297'
date: 2025-07
kind: physical
headline: What would Planet Nine look like?
claim: If Planet Nine is a ~6.6 Earth-mass mini-Neptune, its size, colour, and brightness follow
  from exoplanet mass-radius models.
adds: Planet Nine should sit near absolute magnitude -6.1 to -5.2 and apparent +21.9 to +22.7.
  That is within reach of upcoming surveys -- and would even show a resolvable disk to the largest
  telescopes.
track: none
