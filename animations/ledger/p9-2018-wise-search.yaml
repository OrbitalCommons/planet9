headline: Three quarters of the sky at 3.4 µm
claim: Four years of WISE and NEOWISE coadds extend the moving-object search from one patch
  to every part of the sky away from the galactic plane.
adds: Nothing moves like Planet Nine brighter than W1 = 16.7 over 76% of the sky. That excludes
  a self-luminous planet out to 800-900 AU, but says little if it shines at 3.4 µm by reflected
  sunlight alone, which fades below the limit beyond about 200 AU.
