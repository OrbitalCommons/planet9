title: Measuring the degree of clustering and diffusion of trans-Neptunian objects
arxiv: '2503.07146'
date: 2025-03
kind: evidence
headline: Sorting the orbits by stability
claim: Integrating clones of every distant object measures how fast its orbit diffuses, so the
  clustering can be measured separately for stable and unstable orbits.
adds: Stable and metastable orbits cluster around a perihelion longitude of 50°, more tightly
  farther out, with poles tilted off the planets' plane. Unstable orbits split into two groups
  near 25° and 205°. Any explanation must reproduce that sorting.
