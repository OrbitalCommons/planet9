title: Measuring the Mean Plane of the Distant Kuiper Belt
arxiv: '2508.14156'
date: 2025-08
kind: alternative
headline: A warp in the distant belt
claim: With no unseen planet, the distant Kuiper belt's mean plane must be the invariable plane. A
  bias-free measurement from 50 to 400 AU tests that.
adds: 'The mean plane tilts about 15° beyond 80 AU (96% confidence at 80-200 AU, 98% at 80-400 AU)
  yet stays flat at 50-80 AU. A Mercury-to-Earth-mass planet at 100-200 AU, inclined 10° or more,
  could hold that warp: not Planet Nine.'
