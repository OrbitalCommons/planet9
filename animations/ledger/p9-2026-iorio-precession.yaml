headline: Saturn's verdict on three planets
claim: Saturn's orbital precessions, known to metre level from Cassini, bound where Planet Nine
  and the newer Planet X and Planet Y can be.
adds: Planet X is ruled out, and Planet Y survives only as a Mercury-mass body beyond about 125
  AU. Planet Nine survives near aphelion, at true anomaly 140°-220° and at least 560 AU away
  for 4.9 M⊕. Indicative bounds, not a full ephemeris fit.
