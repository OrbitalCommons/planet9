crate: p9-2016-obliquity-gomes
cite: Gomes, Deienno & Morbidelli (2016)
title: The inclination of the planetary system relative to the solar equator may be explained
  by the presence of Planet 9
arxiv: '1607.05111'
date: 2016-07
kind: indirect
headline: Tilting the whole planetary plane
claim: The giant planets' invariant plane precesses slowly about the total angular momentum,
  Planet Nine included, and so tilts away from the solar equator.
adds: An analytic map from the planet's mass, a, e and inclination to the tilt. Reaching 5.9°
  pins the orbit down. At 10 M⊕ and 30° inclination a 700 AU planet needs e = 0.8, more eccentric
  than Batygin & Brown's 0.6, and its node is tied to the tilt direction.
track: none
