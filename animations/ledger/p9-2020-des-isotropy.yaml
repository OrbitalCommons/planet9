crate: p9-2020-des-isotropy
cite: Bernardinelli et al. (2020)
title: Testing the isotropy of the Dark Energy Survey's extreme trans-Neptunian objects
arxiv: '2003.08901'
date: 2020-03
kind: critique
headline: One survey, tested on its own
claim: If Planet Nine aligns the distant orbits, the extreme objects found by the Dark Energy
  Survey should differ from an isotropic population seen through the same survey.
adds: The first test on a single survey with a fully known selection function. Of twelve Kuiper
  tests on 3 to 7 objects, two reach p = 0.03, both in the node. DES alone neither needs
  Planet Nine nor rules it out.
