cite: Brown (2017)
title: Observational bias and the clustering of distant eccentric Kuiper belt objects
arxiv: '1706.04175'
date: 2017-06
kind: evidence
headline: Can the surveys fake the alignment?
claim: Distant objects are found only near perihelion and only where surveys looked; model
  that bias for each object and ask whether the alignment survives.
adds: The first bias-corrected test. Ten objects beyond 230 AU have only a 1.2% chance of
  sharing their perihelion direction under the modelled survey bias, and 0.025% once the
  clustering of their orbital planes is included. Bias is present but does not explain it.
