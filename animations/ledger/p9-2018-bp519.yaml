headline: An orbit tilted 54 degrees
claim: The Dark Energy Survey finds 2015 BP519, a distant object on a steeply tilted orbit
  that the known giant planets cannot produce.
adds: 'The most extreme orbit yet: a = 450 AU, e = 0.92, tilted 54 degrees, twice as steep
  as any clustered object. Planet Nine pumps distant orbits to such tilts; BP519 would be
  the first of the predicted high-inclination, perihelion-shepherded objects.'
