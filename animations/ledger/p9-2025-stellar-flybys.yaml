title: 'Early Stellar Flybys are Unlikely: Improved Constraints from Sednoids and Large-$q$
  TNOs'
arxiv: '2505.16317'
date: 2025-05
kind: alternative
headline: Did a passing star make the sednoids?
claim: A close stellar flyby early in the Solar System's life could have detached the sednoids
  -- no present-day planet needed.
adds: Folding in how often such an encounter actually happens leaves a probability of only about
  5%. An early flyby is an unlikely sole sculptor of the detached belt.
