headline: Shift-stacking through the galactic plane
claim: A blind shift-stacking pipeline on TESS images can find slow, faint bodies where the
  crowded galactic plane defeats ordinary surveys.
adds: The pipeline recovered Sedna and two fainter objects, then searched Sectors 18-19 at
  70-800 AU. Blind, it is reliable only for V < 21 within 150 AU; Planet Nine at 300-460 AU would
  be bright enough but crawls 2-3 times slower, so the galactic plane stays open.
