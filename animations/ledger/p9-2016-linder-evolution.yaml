title: Evolution and Magnitudes of Candidate Planet Nine
arxiv: '1602.07465'
date: 2016-02
kind: physical
headline: How bright after 4.6 billion years?
claim: Cooling models of a small ice giant give Planet Nine's present radius, temperature
  and brightness in every band from the optical to the far-infrared.
adds: A 10 Earth-mass planet at 700 AU is still 47 K, far above the 10 K sunlight alone would
  give. It is V = 21.7 in reflected light but magnitude 10-11 near 20 µm from its own heat.
  A 50 Earth-mass planet would already have been seen.
