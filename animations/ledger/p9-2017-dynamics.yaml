cite: Batygin & Morbidelli (2017)
title: Dynamical Evolution Induced by Planet Nine
arxiv: '1710.01804'
date: 2017-10
kind: dynamics
headline: A trap in phase space
claim: Orbit-averaged theory alone cannot explain why the anti-aligned cluster survives; the
  missing ingredient should be mean-motion resonance with Planet Nine.
adds: The secular island that anti-aligns orbits sits entirely on orbits crossing Planet Nine's,
  so resonant phase protection is what keeps the cluster alive. It takes over beyond P/P₉ ≈ 0.1,
  where aphelia reach Planet Nine's perihelion.
