headline: Cassini points at a patch of sky
claim: Fitting the Cassini range residuals with a tidal perturber free in direction and strength
  constrains the sky position, distance and mass of a distant planet.
adds: Turned ranging into a place to look. Combined with the orbits the clustering allows, the
  fit leaves a region centred on RA 40°, Dec -15° reaching about 20° each way, and favours a tide
  2.3-11.4 times that of 10 M⊕ at 700 AU.
