kind: discovery
headline: 815 objects, one known selection
claim: Six years of DES images, searched as a single data set, give a catalogue of distant
  objects whose detection biases are known well enough to test models against.
adds: 815 trans-Neptunian objects, 461 of them new, complete to r = 23.8 over 5,000 square
  degrees, with a public survey simulator. Its 16 extreme objects (a > 150 AU) are consistent
  with pointing in random directions.
