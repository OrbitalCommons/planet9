title: No Evidence for Orbital Clustering in the Extreme Trans-Neptunian Objects
arxiv: '2102.05601'
date: 2021-02
kind: critique
headline: Three surveys, no clustering
claim: Simulate where and when DES, OSSOS and the Sheppard-Trujillo survey looked, and the
  alignment of the 14 extreme objects they found may need no planet at all.
adds: With each survey's pointings, depth and tracking folded in, the 14 objects match a uniform
  population at the 17% to 94% level. The alignment can come from where the surveys looked; the
  sample is too small to exclude a planet.
